*{box-sizing:border-box}
html,body,body *{cursor:none}
html,body{margin:0;height:100%;background:#0d0f13;color:#c9ccd4;font-family:"InterLight",system-ui,sans-serif;overflow:hidden}
html,body{background:transparent}
body{display:flex;align-items:center;justify-content:center}
#holder{position:relative}
#scaler{position:absolute;left:0;top:0;width:1013px;height:580px;transform-origin:0 0}
#tilt{width:1013px;height:580px;perspective:1800px}
#card{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform 1.05s cubic-bezier(.65,-0.15,.25,1.15)}
#card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:30px;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  box-shadow:0 0 0 1px rgba(255,255,255,.06);user-select:none;-webkit-user-select:none}
.back{transform:rotateY(180deg)}
.face svg.base,.face canvas,.glare{position:absolute;left:0;top:0;width:1013px;height:580px}
.face canvas,.glare{pointer-events:none}
.glare{background:radial-gradient(520px 380px at var(--gx,50%) var(--gy,30%),rgba(255,255,255,.22),rgba(255,255,255,0) 60%);mix-blend-mode:soft-light;transition:opacity .4s}
/* selectable dot-matrix text: real text sits invisibly on top of the dots */
.tline{position:absolute;white-space:pre;user-select:text;-webkit-user-select:text;cursor:text;color:transparent;font-family:ui-monospace,Menlo,monospace}
.tline{letter-spacing:var(--ls,0px)}
.tline,.tline *,.para,.para *{cursor:text!important}
.flipbtn,.flipbtn *{cursor:default!important}
#cur{position:fixed;left:0;top:0;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;background:#fff;pointer-events:none;z-index:99;
  box-shadow:0 0 6px 2px rgba(255,255,255,.95),0 0 18px 6px rgba(255,255,255,.45),0 0 40px 12px rgba(190,220,255,.18);transition:opacity .15s,transform .18s cubic-bezier(.3,1.6,.5,1)}
#cur.hide{opacity:0}#cur.down{transform:scale(1.8)}
@media (hover:none){#cur{display:none}}
.tline ::selection,.tline::selection{background:transparent;color:transparent}
.flipbtn{position:absolute;left:816px;top:21px;width:175px;height:55px;border:0;background:transparent;cursor:pointer;border-radius:15px;padding:0}
.flipbtn svg{position:absolute;inset:0;overflow:visible}
.flipbtn rect{fill:rgba(255,255,255,0);stroke:#fff;stroke-width:1;stroke-dasharray:2.6 2.2;transition:fill .3s}
.flipbtn:hover rect{fill:rgba(255,255,255,.08);animation:march .9s linear infinite}
.flipbtn:focus-visible{outline:2px solid #bfebfa;outline-offset:3px}
@keyframes march{to{stroke-dashoffset:-9.6}}
/* back paragraph */
.para{position:absolute;left:38.5px;top:412.3px;width:760px;margin:0;font:300 31.5px/39.6px "InterLight",sans-serif;color:#fff;letter-spacing:0;
  user-select:text;-webkit-user-select:text;cursor:text}
.para::selection,.para ::selection{background:rgba(137,204,4,.6);color:#F7F9F2}
.para .w{display:inline-block;opacity:0;filter:blur(10px);transform:translateY(14px);white-space:pre}
.back.show .para .w{animation:win .9s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(var(--d) * 1ms)}

<script>
(()=>{
const D=window.CARD, W=1013, H=580, R=2;
const card=document.getElementById('card'), front=document.getElementById('front'), back=document.getElementById('back');
const cf=document.getElementById('cf').getContext('2d'), cb=document.getElementById('cb').getContext('2d');
const rnd=i=>{const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x)};
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)), eo=x=>1-Math.pow(1-x,3);
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;

// ---------- film grain (baked once; an SVG noise filter loses its grain when the card tilts in 3D) ----------
document.querySelectorAll('canvas.grain').forEach((cv,k)=>{const c=cv.getContext('2d'),id=c.createImageData(1013,580),d=id.data;let s=k*9973+12345;
  for(let i=0;i<d.length;i+=4){s=(s*1103515245+12345)&0x7fffffff;if((s>>8)%1000<940){d[i]=d[i+1]=d[i+2]=255;d[i+3]=64}}c.putImageData(id,0,0)});
// ---------- layout / scaling ----------
const holder=document.getElementById('holder'), scaler=document.getElementById('scaler');
function fit(){const s=Math.min((innerWidth-16)/W,(innerHeight-16)/H);scaler.style.transform=`scale(${s})`;holder.style.width=W*s+'px';holder.style.height=H*s+'px';}
addEventListener('resize',fit);fit();

// ---------- particle groups ----------
function group(n){return {n,hx:new Float32Array(n),hy:new Float32Array(n),x:new Float32Array(n),y:new Float32Array(n),vx:new Float32Array(n),vy:new Float32Array(n),s:new Float32Array(n),a:new Float32Array(n)}}
function setHome(g,i,x,y,s,a){g.hx[i]=g.x[i]=x;g.hy[i]=g.y[i]=y;g.s[i]=s;g.a[i]=a}
// front
const F=group(D.field.length);D.field.forEach((p,i)=>setHome(F,i,p[0],p[1],p[2],p[3]));
const PIMG=new Image();PIMG.src=D.pimg;const BPATHS=D.bpaths.map(([d,s])=>[new Path2D(d),s]);
const BL=document.createElement('canvas');BL.width=2026;BL.height=1160;{const c=BL.getContext('2d');c.setTransform(R,0,0,R,0,0);c.strokeStyle=c.fillStyle='#E8E8E8';c.lineWidth=7;c.lineCap='round';c.lineJoin='round';BPATHS.forEach(([p,s])=>s?c.stroke(p):c.fill(p))}
const SC=document.createElement('canvas');SC.width=2026;SC.height=1160;const sc=SC.getContext('2d');
const P=group(D.portrait.length);D.portrait.forEach((p,i)=>setHome(P,i,p[0],p[1],1.9*Math.sqrt(p[2])*0.98,p[2]));
function textGroup(t){const g=group(t.x.length);g.c=Int16Array.from(t.c);t.x.forEach((x,i)=>setHome(g,i,x,t.y[i],t.d,1));g.t=t;return g}
const TN=textGroup(D.text.name), TT=textGroup(D.text.tag), TF=textGroup(D.text.flip), TB=textGroup(D.text.flip);
// back
const B=group(D.bfly.length);D.bfly.forEach((p,i)=>setHome(B,i,p[0],p[1],2.5,1));
const DU=group(240);for(let i=0;i<DU.n;i++)setHome(DU,i,rnd(i+3)*W,rnd(i+7)*H,0.7+rnd(i+11)*1.4,0.12+rnd(i+13)*0.28);

// ---------- selectable text overlays ----------
const sel={name:new Uint8Array(D.text.name.t.length),tag:new Uint8Array(D.text.tag.t.length)};
// one plain text node per line, letter-spacing set so each character cell matches the dot glyph pitch -> continuous selection highlight
function buildLine(id,t){const el=document.getElementById(id);el.textContent=t.t;
  const fit=()=>{el.style.setProperty('--ls','0px');const r=document.createRange();r.selectNodeContents(el);const w=r.getBoundingClientRect().width/(el.getBoundingClientRect().width/el.offsetWidth||1);
    el.style.setProperty('--ls',(t.A-w/t.t.length)+'px')};fit();document.fonts&&document.fonts.ready.then(fit);addEventListener('resize',fit);return el}
const lineN=buildLine('t-name',D.text.name), lineT=buildLine('t-tag',D.text.tag);
document.addEventListener('selectionchange',()=>{const s=getSelection();
  for(const [k,el] of [['name',lineN],['tag',lineT]]){const a=sel[k];a.fill(0);if(!s.rangeCount||s.isCollapsed)continue;
    const r=s.getRangeAt(0),tn=el.firstChild;if(!tn||!r.intersectsNode(tn))continue;
    const st=r.startContainer===tn?r.startOffset:0,en=r.endContainer===tn?r.endOffset:a.length;for(let i=st;i<en;i++)a[i]=1}});

// ---------- back paragraph: wrap words for staggered reveal ----------
(()=>{const p=document.getElementById('para');const kws=['AI-Native','Usefulness','Efficiency','Simplicity'];let k=0;
  const lines=p.innerHTML.split('<br>');p.innerHTML='';
  lines.forEach((ln,li)=>{ln.split(/(\s+)/).forEach(tok=>{if(!tok)return;
      if(/^\s+$/.test(tok)){p.appendChild(document.createTextNode(tok));return}
      const s=document.createElement('span');s.className='w'+(kws.some(w=>tok.startsWith(w))?' kw':'');s.textContent=tok;s.style.setProperty('--d',380+k*55);k++;p.appendChild(s)});
    if(li<lines.length-1)p.appendChild(document.createElement('br'))});
  // selecting: swap to plain text so the highlight has no seams between word wrappers; restored on next flip
  const wrapped=p.innerHTML,plain=lines.join('<br>');
  p.addEventListener('pointerenter',()=>{if(p.dataset.plain||!p.classList.contains('done'))return;p.dataset.plain=1;p.innerHTML=plain});
  p.addEventListener('pointerleave',()=>{const s=getSelection();if(!p.dataset.plain||(s.rangeCount&&!s.isCollapsed&&p.contains(s.anchorNode)))return;delete p.dataset.plain;p.innerHTML=wrapped});
  document.addEventListener('selectionchange',()=>{const s=getSelection();if(p.dataset.plain&&(s.isCollapsed||!p.contains(s.anchorNode))&&!p.matches(':hover')){delete p.dataset.plain;p.innerHTML=wrapped}});
  window.__rewrap=()=>{delete p.dataset.plain;p.innerHTML=wrapped};})();

// ---------- pointer ----------
const M={x:-999,y:-999,vx:0,vy:0,on:false,px:0,py:0};const ripples=[];
let flipped=false,tFront=0,tBack=-1e9;
function local(e){const face=flipped?back:front;const r=face.getBoundingClientRect();return [(e.clientX-r.left)/r.width*W,(e.clientY-r.top)/r.height*H]}
const cur=document.getElementById('cur');
function blocked(e,x,y){return !!e.target.closest('.tline,.para,.flipbtn')||(!flipped&&x>=429&&x<=589&&y>=204&&y<=375)}
addEventListener('pointermove',e=>{const [x,y]=local(e);M.block=blocked(e,x,y);
  cur.style.left=e.clientX+'px';cur.style.top=e.clientY+'px';cur.classList.toggle('hide',e.pointerType!=='mouse'||!!e.target.closest('.tline,.para,.flipbtn'));M.vx=x-M.x;M.vy=y-M.y;if(!M.on){M.vx=M.vy=0}M.x=x;M.y=y;M.on=x>-40&&x<W+40&&y>-40&&y<H+40;
  const tx=(e.clientX/innerWidth-.5),ty=(e.clientY/innerHeight-.5);tilt.tx=tx;tilt.ty=ty;
  document.querySelectorAll('.glare').forEach(g=>{g.style.setProperty('--gx',(flipped?W-x:x)/W*100+'%');g.style.setProperty('--gy',y/H*100+'%')})});
document.documentElement.addEventListener('mouseleave',()=>{M.on=false;cur.classList.add('hide');tilt.tx=tilt.ty=0});
addEventListener('pointerdown',()=>cur.classList.add('down'));addEventListener('pointerup',()=>cur.classList.remove('down'));
document.querySelectorAll('.face').forEach(f=>f.addEventListener('pointerdown',e=>{const [x,y]=local(e);if(!e.target.closest('.tline,.para'))getSelection().removeAllRanges();if(blocked(e,x,y))return;ripples.push({x,y,t:performance.now()/1000})}));
document.querySelectorAll('.flipbtn').forEach(b=>b.addEventListener('click',()=>{flipped=!flipped;card.classList.toggle('flipped',flipped);getSelection().removeAllRanges();
  const now=performance.now()/1000;
  const para=document.getElementById('para');para.classList.remove('done');window.__rewrap&&window.__rewrap();clearTimeout(window.__pd);
  if(flipped){window.__pd=setTimeout(()=>para.classList.add('done'),2800);tBack=now+0.35;back.classList.remove('show');void back.offsetWidth;back.classList.add('show');scatter(B,180)}else{tFront=now+0.35}
}));
const tilt={tx:0,ty:0,x:0,y:0};
function scatter(g,r){for(let i=0;i<g.n;i++){const a=rnd(i*3.1)*6.283,d=r*(0.4+rnd(i*5.7));g.x[i]=g.hx[i]+Math.cos(a)*d;g.y[i]=g.hy[i]+Math.sin(a)*d;g.vx[i]=g.vy[i]=0}}

// ---------- physics ----------
function step(g,K,DAMP,push,now,act){
  const RM=62,RM2=RM*RM,mx=M.x,my=M.y,on=M.on&&!M.block;const mvx=clamp(M.vx,-40,40),mvy=clamp(M.vy,-40,40);
  for(let i=0;i<g.n;i++){
    let x=g.x[i],y=g.y[i],vx=g.vx[i],vy=g.vy[i];
    if(on){const dx=x-mx,dy=y-my,d2=dx*dx+dy*dy;if(d2<RM2){const d=Math.sqrt(d2)+.01;let f=1-d/RM;f*=f;vx+=dx/d*f*push+mvx*f*0.22;vy+=dy/d*f*push+mvy*f*0.22}}
    for(const r of ripples){const rad=(now-r.t)*520;const dx=x-r.x,dy=y-r.y,d=Math.sqrt(dx*dx+dy*dy)+.01;const w=Math.exp(-((d-rad)*(d-rad))/700)*3.2*Math.max(0,1-(now-r.t)/1.4);if(w>0.01){vx+=dx/d*w;vy+=dy/d*w}}
    const k=act?K*act(i):K;
    vx+=(g.hx[i]-x)*k;vy+=(g.hy[i]-y)*k;vx*=DAMP;vy*=DAMP;g.x[i]=x+vx;g.y[i]=y+vy;g.vx[i]=vx;g.vy[i]=vy;
  }
}

// ---------- drawing helpers ----------
function rects(c,g,col,alpha,sizeFn){c.fillStyle=col;c.globalAlpha=alpha;c.beginPath();for(let i=0;i<g.n;i++){const s=sizeFn?sizeFn(i):g.s[i];if(s<=0.05)continue;c.rect(g.x[i]-s/2,g.y[i]-s/2,s,s)}c.fill();c.globalAlpha=1}
// text dots with LED intro, idle light sweep and selection highlight
function dots(c,arr,dx,dy){c.beginPath();for(let j=0;j<arr.length;j+=3){const x=arr[j]+dx,y=arr[j+1]+dy,r=arr[j+2]/2;c.moveTo(x+r,y);c.arc(x,y,r,0,6.283)}c.fill()}
// text dots with LED intro, idle light sweep, selection highlight and an emphasised word (italic + RGB split glitch)
function drawText(c,g,t,start,stagger,selArr,now,sweepPh,emph){
  const buckets=[[],[],[],[]],hi=[],em=[];
  const gl=emph?glitch(now):0;
  for(let i=0;i<g.n;i++){
    const ci=g.c[i],on=start+ci*stagger+rnd(i*1.7)*0.22,u=t-on;if(u<0)continue;
    let a=u<0.16?(rnd(i*9.1+Math.floor(t*28))>0.45?1:0.15):1;
    let s=g.s[i],x=g.x[i],y=g.y[i];
    if(sweepPh>=0){const bx=-120+sweepPh*1300,dd=(g.hx[i]-bx)/55;const w=Math.exp(-dd*dd);s*=1+0.3*w;y-=1.6*w;a=Math.min(1,a*(0.8+0.6*w))}
    else a*=0.92;
    if(emph&&ci>=emph[0]&&ci<=emph[1]){
      const k=clamp(u/0.5);                                   // slant eases in after the letter lights up
      const row=(g.hy[i]-emph[2]);x-=row*0.26*k;
      if(gl>0){const band=Math.floor((g.hy[i]-500)/9);x+=(rnd(band*13.7+Math.floor(now*24))-.5)*9*gl}
      if(selArr&&selArr[ci]){hi.push(x,y,s*1.25);continue}
      em.push(x,y,s*1.12);continue}
    if(selArr&&selArr[ci]){hi.push(x,y,s*1.25);continue}
    buckets[Math.min(3,Math.floor(a*3.99))].push(x,y,s);
  }
  if(selArr&&selArr.some(v=>v)){const top=g===TN?24:505;c.fillStyle='rgba(137,204,4,.6)';c.beginPath();
    for(let ci=0;ci<selArr.length;ci++)if(selArr[ci])c.rect(g.t.s+ci*g.t.A,top,g.t.A+0.5,54);c.fill()}
  c.fillStyle='#fff';
  buckets.forEach((b,k)=>{if(!b.length)return;c.globalAlpha=0.25+k*0.25;dots(c,b,0,0)});
  c.globalAlpha=1;
  if(em.length){
    const sp=1.7+3.2*gl+0.4*Math.sin(now*2.1);
    c.globalAlpha=0.95;c.fillStyle='#ff4f7b';dots(c,em,-sp,0);
    c.fillStyle='#3fe9ff';dots(c,em,sp,0.3*gl);
    c.globalAlpha=1;c.fillStyle='#fff';c.shadowColor='rgba(255,255,255,.9)';c.shadowBlur=7;dots(c,em,0,0);c.shadowBlur=0;
    if(selArr&&em.length){} }
  if(hi.length){c.globalAlpha=1;c.fillStyle='#F7F9F2';c.shadowColor='rgba(255,255,255,.7)';c.shadowBlur=10;dots(c,hi,0,0);c.shadowBlur=0}
  c.globalAlpha=1;
}
// short glitch bursts on the emphasised word
function glitch(now){const p=now%3.1;return p<0.18?Math.sin(p/0.18*Math.PI):(p>1.6&&p<1.68?0.6:0)}
function cursorBlock(c,g,t,start,stagger,n){ // typing cursor for the tagline
  const typed=Math.floor((t-start)/stagger);const end=start+n*stagger;
  if(t<start-0.3||t>end+1.6)return;const ci=Math.min(n,Math.max(0,typed));
  if(t>end&&Math.floor((t-end)*2.5)%2)return;
  const x0=g.t.s+ci*g.t.A+4;
  c.fillStyle='#fff';c.globalAlpha=0.85;c.beginPath();
  for(let yy=0;yy<7;yy++)for(let xx=0;xx<5;xx++){const x=x0+xx*5.4,y=512.8+yy*5.4;c.moveTo(x+2,y);c.arc(x,y,2,0,6.283)}c.fill();c.globalAlpha=1;
}

// ---------- render loop ----------
let last=performance.now();
function frame(nowMs){
  if(window.__idcPaused){requestAnimationFrame(frame);return}
  const now=nowMs/1000;M.vx*=0.6;M.vy*=0.6;
  while(ripples.length&&now-ripples[0].t>1.5)ripples.shift();
  // tilt
  tilt.x+=(tilt.tx-tilt.x)*0.08;tilt.y+=(tilt.ty-tilt.y)*0.08;
  document.getElementById('tilt').style.transform=`rotateY(${tilt.x*4}deg) rotateX(${-tilt.y*3}deg)`;
  const showF=!flipped||now<tBack+0.2, showB=flipped||now<tFront+0.2;
  // ---- front
  if(showF){
    const t=now-tFront;
    step(F,0.055,0.88,2.2,now);step(P,0.05,0.88,1.6,now);step(TN,0.075,0.86,2.6,now);step(TT,0.075,0.86,2.6,now);step(TF,0.08,0.85,1.6,now);
    const c=cf;c.setTransform(R,0,0,R,0,0);c.clearRect(0,0,W,H);
    // halftone field: ripple-in from the portrait
    c.fillStyle='#0a1114';c.globalAlpha=0.5;c.beginPath();
    for(let i=0;i<F.n;i++){const d=Math.hypot(F.hx[i]-509,F.hy[i]-289);const k=eo(clamp((t-0.05-d/1500)/0.6));if(k<=0)continue;const w=F.s[i]*k,h=F.a[i]*k;c.rect(F.x[i]-w/2,F.y[i]-h/2,w,h)}
    c.fill();c.globalAlpha=1;
    // portrait: crisp image at rest, develops top-down; disturbed dots break out of it
    const rv=clamp((t-0.15)/0.9);
    c.save();c.beginPath();c.roundRect(429,204,160,171,20);c.clip();c.fillStyle='#DCDDE0';c.fill();
    if(PIMG.complete&&rv>0){c.save();c.beginPath();c.rect(429,204,160,171*eo(rv));c.clip();c.drawImage(PIMG,429,204,160,171);c.restore();
      if(rv<1){const yy=204+171*eo(rv);const g=c.createLinearGradient(0,yy-14,0,yy);g.addColorStop(0,'rgba(255,255,255,0)');g.addColorStop(1,'rgba(255,255,255,.9)');c.fillStyle=g;c.fillRect(429,yy-14,160,14)}}
    c.fillStyle='#DCDDE0';c.beginPath();let moved=0;
    for(let i=0;i<P.n;i++){if(Math.abs(P.x[i]-P.hx[i])+Math.abs(P.y[i]-P.hy[i])>0.45){c.rect(P.hx[i]-1.05,P.hy[i]-1.05,2.1,2.1);moved++}}
    c.fill();c.restore();
    if(moved){c.fillStyle='#3a3b40';c.beginPath();for(let i=0;i<P.n;i++){if(Math.abs(P.x[i]-P.hx[i])+Math.abs(P.y[i]-P.hy[i])>0.45){const s=P.s[i];c.rect(P.x[i]-s/2,P.y[i]-s/2,s,s)}}c.fill()}
    const ph=reduce?-1:((t-3.2)%7)/1.6;const sw=t>3.2&&ph>=0&&ph<=1?ph:-1;
    drawText(c,TN,t,0.25,0.07,sel.name,now,sw);
    drawText(c,TT,t,1.0,0.045,sel.tag,now,sw>=0?Math.max(-1,sw*1.05-0.05):-1,[8,16,529]);
    cursorBlock(c,TT,t,1.0,0.045,TT.t.t.length);
    drawText(c,TF,t,2.3,0.035,null,now,-1);
  }
  // ---- back
  if(showB){
    const t=now-tBack;
    step(B,0.06,0.87,2.4,now,i=>clamp((t-0.1-rnd(i*2.3)*0.5)/0.2));
    for(let i=0;i<DU.n;i++){DU.hx[i]=(rnd(i+3)*W+now*(6+rnd(i+5)*10))%W;DU.hy[i]=(rnd(i+7)*H+Math.sin(now*.3+i)*12)%H}
    step(DU,0.02,0.92,3.0,now);step(TB,0.08,0.85,1.6,now);
    const c=cb;c.setTransform(R,0,0,R,0,0);c.clearRect(0,0,W,H);
    // dust
    c.fillStyle='#fff';for(let k=0;k<3;k++){c.globalAlpha=0.12+k*0.1;c.beginPath();for(let i=k;i<DU.n;i+=3){c.moveTo(DU.x[i]+DU.s[i]/2,DU.y[i]);c.arc(DU.x[i],DU.y[i],DU.s[i]/2,0,6.283)}c.fill()}
    c.globalAlpha=1;
    // butterfly mark: crisp strokes at rest; displaced pieces become particles
    sc.setTransform(1,0,0,1,0,0);sc.clearRect(60,50,220,240);sc.globalCompositeOperation='source-over';sc.drawImage(BL,60,50,220,240,60,50,220,240);
    sc.setTransform(R,0,0,R,0,0);sc.globalCompositeOperation='destination-out';sc.beginPath();
    const mv=[];for(let i=0;i<B.n;i++){const d=Math.abs(B.x[i]-B.hx[i])+Math.abs(B.y[i]-B.hy[i]);const k=clamp((t-0.1-rnd(i*2.3)*0.5)/0.25);if(d>0.5||k<1){sc.moveTo(B.hx[i]+1.3,B.hy[i]);sc.arc(B.hx[i],B.hy[i],1.3,0,6.283);if(k>0)mv.push(i)}}
    sc.fill();sc.globalCompositeOperation='source-over';
    c.setTransform(1,0,0,1,0,0);c.drawImage(SC,60,50,220,240,60,50,220,240);c.setTransform(R,0,0,R,0,0);
    c.fillStyle='#E8E8E8';c.beginPath();for(const i of mv){const k=clamp((t-0.1-rnd(i*2.3)*0.5)/0.25);const s=B.s[i]*k;c.moveTo(B.x[i]+s/2,B.y[i]);c.arc(B.x[i],B.y[i],s/2,0,6.283)}c.fill();
    drawText(c,TB,t,0.9,0.035,null,now,-1);
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script></body></html>
