<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720"><rect width="1280" height="720" fill="#0b0b0b"/><text font-family="Helvetica, 'Helvetica Neue', Arial, sans-serif" font-weight="300" font-size="12" fill="#9a9a9a" text-anchor="start" letter-spacing="1.2"><tspan x="57.6" y="62.0">KNOTBOARD · AI ASSISTANCE</tspan></text><text font-family="Helvetica, 'Helvetica Neue', Arial, sans-serif" font-weight="300" font-size="30" fill="#f2f2f2" text-anchor="start"><tspan x="57.6" y="104.0">Three levels of assistance</tspan></text><line x1="57.6" y1="150" x2="1222.4" y2="150" stroke="#f2f2f2" stroke-width="1.33"/><line x1="57.6" y1="662.4" x2="1222.4" y2="662.4" stroke="#f2f2f2" stroke-width="1.33"/><line x1="57.6" y1="150" x2="57.6" y2="662.4" stroke="#f2f2f2" stroke-width="1.33"/><line x1="445.86666666666673" y1="150" x2="445.86666666666673" y2="662.4" stroke="#f2f2f2" stroke-width="1.33"/><line x1="834.1333333333334" y1="150" x2="834.1333333333334" y2="662.4" stroke="#f2f2f2" stroke-width="1.33"/><line x1="1222.4" y1="150" x2="1222.4" y2="662.4" stroke="#f2f2f2" stroke-width="1.33"/><text font-family="Helvetica, 'Helvetica Neue', Arial, sans-serif" font-weight="300" font-size="13" fill="#9a9a9a" text-anchor="start"><tspan x="97.6" y="200.0">01</tspan></text><rect x="333.86666666666673" y="184" width="72" height="72" fill="none" stroke="#f2f2f2" stroke-width="1.33"/><rect x="347.86666666666673" y="198" width="44" height="44" fill="none" stroke="#333333" stroke-width="1"/><rect x="359.86666666666673" y="210" width="20" height="20" fill="none" stroke="#333333" stroke-width="1"/><text font-family="Helvetica, 'Helvetica Neue', Arial, sans-serif" font-weight="300" font-size="11" fill="#9a9a9a" text-anchor="start" letter-spacing="1.2"><tspan x="97.6" y="422.0">WORKSPACE</tspan></text><text font-family="Helvetica, 'Helvetica Neue', Arial, sans-serif" font-weight="300" font-size="30" fill="#f2f2f2" text-anchor="start"><tspan x="97.6" y="462.0">Global</tspan></text><text font-family="Helvetica, 'Helvetica Neue', Arial, sans-serif" font-weight="300" font-size="15" fill="#9a9a9a" text-anchor="start"><tspan x="97.6" y="510.0">A movable Agent button opens a side panel</tspan><tspan x="97.6" y="533.0">for questions that span the workspace.</tspan><tspan x="97.6" y="556.0">Users can ask about workload, priorities,</tspan><tspan x="97.6" y="579.0">progress, or project history.</tspan></text><text font-family="Helvetica, 'Helvetica Neue', Arial, sans-serif" font-weight="300" font-size="13" fill="#9a9a9a" text-anchor="start"><tspan x="485.86666666666673" y="200.0">02</tspan></text><rect x="722.1333333333334" y="184" width="72" height="72" fill="none" stroke="#333333" stroke-width="1"/><rect x="736.1333333333334" y="198" width="44" height="44" fill="none" stroke="#f2f2f2" stroke-width="1.33"/><rect x="748.1333333333334" y="210" width="20" height="20" fill="none" stroke="#333333" stroke-width="1"/><text font-family="Helvetica, 'Helvetica Neue', Arial, sans-serif" font-weight="300" font-size="11" fill="#9a9a9a" text-anchor="start" letter-spacing="1.2"><tspan x="485.86666666666673" y="422.0">CURRENT PAGE</tspan></text><text font-family="Helvetica, 'Helvetica Neue', Arial, sans-serif" font-weight="300" font-size="30" fill="#f2f2f2" text-anchor="start"><tspan x="485.86666666666673" y="462.0">Page level</tspan></text><text font-family="Helvetica, 'Helvetica Neue', Arial, sans-serif" font-weight="300" font-size="15" fill="#9a9a9a" text-anchor="start"><tspan x="485.86666666666673" y="510.0">Planner, Project, and Dashboard can offer</tspan><tspan x="485.86666666666673" y="533.0">suggestions based on the current page, such</tspan><tspan x="485.86666666666673" y="556.0">as scheduling backlog tasks or drafting a</tspan><tspan x="485.86666666666673" y="579.0">weekly review.</tspan></text><text font-family="Helvetica, 'Helvetica Neue', Arial, sans-serif" font-weight="300" font-size="13" fill="#9a9a9a" text-anchor="start"><tspan x="874.1333333333334" y="200.0">03</tspan></text><rect x="1110.4" y="184" width="72" height="72" fill="none" stroke="#333333" stroke-width="1"/><rect x="1124.4" y="198" width="44" height="44" fill="none" stroke="#333333" stroke-width="1"/><rect x="1136.4" y="210" width="20" height="20" fill="#f2f2f2" stroke="#f2f2f2" stroke-width="1.33"/><text font-family="Helvetica, 'Helvetica Neue', Arial, sans-serif" font-weight="300" font-size="11" fill="#9a9a9a" text-anchor="start" letter-spacing="1.2"><tspan x="874.1333333333334" y="422.0">SINGLE ITEM</tspan></text><text font-family="Helvetica, 'Helvetica Neue', Arial, sans-serif" font-weight="300" font-size="30" fill="#f2f2f2" text-anchor="start"><tspan x="874.1333333333334" y="462.0">Object level</tspan></text><text font-family="Helvetica, 'Helvetica Neue', Arial, sans-serif" font-weight="300" font-size="15" fill="#9a9a9a" text-anchor="start"><tspan x="874.1333333333334" y="510.0">An inspiration item or project can call AI</tspan><tspan x="874.1333333333334" y="533.0">with its own context, for example to</tspan><tspan x="874.1333333333334" y="556.0">summarize a reference, propose categories,</tspan><tspan x="874.1333333333334" y="579.0">or outline a plan.</tspan></text></svg>