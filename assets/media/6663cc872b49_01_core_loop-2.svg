<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720"><rect width="1280" height="720" fill="#0b0b0b"/><text font-family="Helvetica, 'Helvetica Neue', Arial, sans-serif" font-weight="300" font-size="12" fill="#9a9a9a" text-anchor="start" letter-spacing="1.2"><tspan x="57.6" y="62.0">KNOTBOARD · THE CORE LOOP</tspan></text><text font-family="Helvetica, 'Helvetica Neue', Arial, sans-serif" font-weight="300" font-size="30" fill="#f2f2f2" text-anchor="start"><tspan x="57.6" y="104.0">Five stages, one continuous thread</tspan></text><line x1="174.08" y1="162" x2="1105.92" y2="162" stroke="#f2f2f2" stroke-width="1.33"/><circle cx="174.08" cy="162" r="4.5" fill="#f2f2f2" stroke="#f2f2f2" stroke-width="1.33"/><circle cx="407.0400000000001" cy="162" r="4.5" fill="#0b0b0b" stroke="#f2f2f2" stroke-width="1.33"/><circle cx="640.0000000000001" cy="162" r="4.5" fill="#0b0b0b" stroke="#f2f2f2" stroke-width="1.33"/><circle cx="872.9600000000002" cy="162" r="4.5" fill="#0b0b0b" stroke="#f2f2f2" stroke-width="1.33"/><circle cx="1105.92" cy="162" r="4.5" fill="#f2f2f2" stroke="#f2f2f2" stroke-width="1.33"/><path d="M1105.92 157.5 V138 H174.08 V153" fill="none" stroke="#9a9a9a" stroke-width="1" stroke-dasharray="3 4"/><path d="M170.08 148 L174.08 154 L178.08 148" fill="none" stroke="#9a9a9a" stroke-width="1"/><text font-family="Helvetica, 'Helvetica Neue', Arial, sans-serif" font-weight="300" font-size="11" fill="#9a9a9a" text-anchor="middle" letter-spacing="0.6"><tspan x="640.0" y="132.0">repeat weekly</tspan></text><line x1="57.6" y1="200" x2="1222.4" y2="200" stroke="#f2f2f2" stroke-width="1.33"/><line x1="57.6" y1="662.4" x2="1222.4" y2="662.4" stroke="#f2f2f2" stroke-width="1.33"/><line x1="57.6" y1="200" x2="57.6" y2="662.4" stroke="#f2f2f2" stroke-width="1.33"/><line x1="290.56000000000006" y1="200" x2="290.56000000000006" y2="662.4" stroke="#f2f2f2" stroke-width="1.33"/><line x1="523.5200000000001" y1="200" x2="523.5200000000001" y2="662.4" stroke="#f2f2f2" stroke-width="1.33"/><line x1="756.4800000000001" y1="200" x2="756.4800000000001" y2="662.4" stroke="#f2f2f2" stroke-width="1.33"/><line x1="989.4400000000002" y1="200" x2="989.4400000000002" y2="662.4" stroke="#f2f2f2" stroke-width="1.33"/><line x1="1222.4" y1="200" x2="1222.4" y2="662.4" stroke="#f2f2f2" stroke-width="1.33"/><text font-family="Helvetica, 'Helvetica Neue', Arial, sans-serif" font-weight="300" font-size="13" fill="#9a9a9a" text-anchor="start"><tspan x="85.6" y="244.0">01</tspan></text><text font-family="Helvetica, 'Helvetica Neue', Arial, sans-serif" font-weight="300" font-size="30" fill="#f2f2f2" text-anchor="start"><tspan x="85.6" y="450.0">Capture</tspan></text><text font-family="Helvetica, 'Helvetica Neue', Arial, sans-serif" font-weight="300" font-size="15" fill="#9a9a9a" text-anchor="start"><tspan x="85.6" y="500.0">Save an image, URL, note,</tspan><tspan x="85.6" y="523.0">PDF, or file before the</tspan><tspan x="85.6" y="546.0">idea disappears.</tspan></text><text font-family="Helvetica, 'Helvetica Neue', Arial, sans-serif" font-weight="300" font-size="13" fill="#9a9a9a" text-anchor="start"><tspan x="318.56000000000006" y="244.0">02</tspan></text><text font-family="Helvetica, 'Helvetica Neue', Arial, sans-serif" font-weight="300" font-size="30" fill="#f2f2f2" text-anchor="start"><tspan x="318.56000000000006" y="450.0">Connect</tspan></text><text font-family="Helvetica, 'Helvetica Neue', Arial, sans-serif" font-weight="300" font-size="15" fill="#9a9a9a" text-anchor="start"><tspan x="318.56000000000006" y="500.0">Add context, tags, a</tspan><tspan x="318.56000000000006" y="523.0">collection, or a related</tspan><tspan x="318.56000000000006" y="546.0">project so the reference</tspan><tspan x="318.56000000000006" y="569.0">remains useful.</tspan></text><text font-family="Helvetica, 'Helvetica Neue', Arial, sans-serif" font-weight="300" font-size="13" fill="#9a9a9a" text-anchor="start"><tspan x="551.5200000000001" y="244.0">03</tspan></text><text font-family="Helvetica, 'Helvetica Neue', Arial, sans-serif" font-weight="300" font-size="30" fill="#f2f2f2" text-anchor="start"><tspan x="551.5200000000001" y="450.0">Schedule</tspan></text><text font-family="Helvetica, 'Helvetica Neue', Arial, sans-serif" font-weight="300" font-size="15" fill="#9a9a9a" text-anchor="start"><tspan x="551.5200000000001" y="500.0">Turn the idea into a task</tspan><tspan x="551.5200000000001" y="523.0">and place it in a weekly</tspan><tspan x="551.5200000000001" y="546.0">plan or on the calendar</tspan><tspan x="551.5200000000001" y="569.0">when timing matters.</tspan></text><text font-family="Helvetica, 'Helvetica Neue', Arial, sans-serif" font-weight="300" font-size="13" fill="#9a9a9a" text-anchor="start"><tspan x="784.4800000000001" y="244.0">04</tspan></text><text font-family="Helvetica, 'Helvetica Neue', Arial, sans-serif" font-weight="300" font-size="30" fill="#f2f2f2" text-anchor="start"><tspan x="784.4800000000001" y="450.0">Make</tspan></text><text font-family="Helvetica, 'Helvetica Neue', Arial, sans-serif" font-weight="300" font-size="15" fill="#9a9a9a" text-anchor="start"><tspan x="784.4800000000001" y="500.0">Track progress, complete</tspan><tspan x="784.4800000000001" y="523.0">the work, and attach a</tspan><tspan x="784.4800000000001" y="546.0">deliverable when there is</tspan><tspan x="784.4800000000001" y="569.0">one.</tspan></text><text font-family="Helvetica, 'Helvetica Neue', Arial, sans-serif" font-weight="300" font-size="13" fill="#9a9a9a" text-anchor="start"><tspan x="1017.4400000000002" y="244.0">05</tspan></text><text font-family="Helvetica, 'Helvetica Neue', Arial, sans-serif" font-weight="300" font-size="30" fill="#f2f2f2" text-anchor="start"><tspan x="1017.4400000000002" y="450.0">Review</tspan></text><text font-family="Helvetica, 'Helvetica Neue', Arial, sans-serif" font-weight="300" font-size="15" fill="#9a9a9a" text-anchor="start"><tspan x="1017.4400000000002" y="500.0">Use the dashboard and</tspan><tspan x="1017.4400000000002" y="523.0">weekly reflection to</tspan><tspan x="1017.4400000000002" y="546.0">understand what moved</tspan><tspan x="1017.4400000000002" y="569.0">forward and what should</tspan><tspan x="1017.4400000000002" y="592.0">change next.</tspan></text></svg>