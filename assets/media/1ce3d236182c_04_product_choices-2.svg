<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720"><rect width="1280" height="720" fill="#0b0b0b"/><text font-family="Helvetica, 'Helvetica Neue', Arial, sans-serif" font-weight="300" font-size="12" fill="#9a9a9a" text-anchor="start" letter-spacing="1.2"><tspan x="57.6" y="62.0">KNOTBOARD · PRODUCT CHOICES</tspan></text><text font-family="Helvetica, 'Helvetica Neue', Arial, sans-serif" font-weight="300" font-size="30" fill="#f2f2f2" text-anchor="start"><tspan x="57.6" y="104.0">The strongest choices protect the real behavior of creative work</tspan></text><line x1="57.6" y1="150.0" x2="1222.4" y2="150.0" stroke="#f2f2f2" stroke-width="1.33"/><line x1="57.6" y1="406.2" x2="1222.4" y2="406.2" stroke="#f2f2f2" stroke-width="1.33"/><line x1="57.6" y1="662.4" x2="1222.4" y2="662.4" stroke="#f2f2f2" stroke-width="1.33"/><line x1="57.6" y1="150" x2="57.6" y2="662.4" stroke="#f2f2f2" stroke-width="1.33"/><line x1="445.86666666666673" y1="150" x2="445.86666666666673" y2="662.4" stroke="#f2f2f2" stroke-width="1.33"/><line x1="834.1333333333334" y1="150" x2="834.1333333333334" y2="662.4" stroke="#f2f2f2" stroke-width="1.33"/><line x1="1222.4" y1="150" x2="1222.4" y2="662.4" stroke="#f2f2f2" stroke-width="1.33"/><text font-family="Helvetica, 'Helvetica Neue', Arial, sans-serif" font-weight="300" font-size="13" fill="#9a9a9a" text-anchor="start"><tspan x="97.6" y="194.0">01</tspan></text><text font-family="Helvetica, 'Helvetica Neue', Arial, sans-serif" font-weight="300" font-size="21" fill="#f2f2f2" text-anchor="start"><tspan x="97.6" y="278.0">Capture before classification</tspan></text><text font-family="Helvetica, 'Helvetica Neue', Arial, sans-serif" font-weight="300" font-size="15" fill="#9a9a9a" text-anchor="start"><tspan x="97.6" y="316.0">A heavy form would make users postpone</tspan><tspan x="97.6" y="339.0">saving. Knotboard lets them record the idea</tspan><tspan x="97.6" y="362.0">first and enrich it when its value becomes</tspan><tspan x="97.6" y="385.0">clearer.</tspan></text><text font-family="Helvetica, 'Helvetica Neue', Arial, sans-serif" font-weight="300" font-size="13" fill="#9a9a9a" text-anchor="start"><tspan x="485.86666666666673" y="194.0">02</tspan></text><text font-family="Helvetica, 'Helvetica Neue', Arial, sans-serif" font-weight="300" font-size="21" fill="#f2f2f2" text-anchor="start"><tspan x="485.86666666666673" y="278.0">Keep tasks unscheduled</tspan></text><text font-family="Helvetica, 'Helvetica Neue', Arial, sans-serif" font-weight="300" font-size="15" fill="#9a9a9a" text-anchor="start"><tspan x="485.86666666666673" y="316.0">Exploratory work does not always have a</tspan><tspan x="485.86666666666673" y="339.0">date. Backlog gives it a visible home</tspan><tspan x="485.86666666666673" y="362.0">without adding false urgency.</tspan></text><text font-family="Helvetica, 'Helvetica Neue', Arial, sans-serif" font-weight="300" font-size="13" fill="#9a9a9a" text-anchor="start"><tspan x="874.1333333333334" y="194.0">03</tspan></text><text font-family="Helvetica, 'Helvetica Neue', Arial, sans-serif" font-weight="300" font-size="21" fill="#f2f2f2" text-anchor="start"><tspan x="874.1333333333334" y="278.0">Separate completion from output</tspan></text><text font-family="Helvetica, 'Helvetica Neue', Arial, sans-serif" font-weight="300" font-size="15" fill="#9a9a9a" text-anchor="start"><tspan x="874.1333333333334" y="316.0">Some meaningful work produces a file; some</tspan><tspan x="874.1333333333334" y="339.0">produces knowledge or a decision. Requiring</tspan><tspan x="874.1333333333334" y="362.0">a deliverable would distort both.</tspan></text><text font-family="Helvetica, 'Helvetica Neue', Arial, sans-serif" font-weight="300" font-size="13" fill="#9a9a9a" text-anchor="start"><tspan x="97.6" y="450.2">04</tspan></text><text font-family="Helvetica, 'Helvetica Neue', Arial, sans-serif" font-weight="300" font-size="21" fill="#f2f2f2" text-anchor="start"><tspan x="97.6" y="534.2">Use one source of truth</tspan></text><text font-family="Helvetica, 'Helvetica Neue', Arial, sans-serif" font-weight="300" font-size="15" fill="#9a9a9a" text-anchor="start"><tspan x="97.6" y="572.2">Planner, Calendar, Tasks, and Projects</tspan><tspan x="97.6" y="595.2">solve different viewing needs. Duplicate</tspan><tspan x="97.6" y="618.2">task records would create conflicts and</tspan><tspan x="97.6" y="641.2">weaken trust.</tspan></text><text font-family="Helvetica, 'Helvetica Neue', Arial, sans-serif" font-weight="300" font-size="13" fill="#9a9a9a" text-anchor="start"><tspan x="485.86666666666673" y="450.2">05</tspan></text><text font-family="Helvetica, 'Helvetica Neue', Arial, sans-serif" font-weight="300" font-size="21" fill="#f2f2f2" text-anchor="start"><tspan x="485.86666666666673" y="534.2">Pair metrics with reflection</tspan></text><text font-family="Helvetica, 'Helvetica Neue', Arial, sans-serif" font-weight="300" font-size="15" fill="#9a9a9a" text-anchor="start"><tspan x="485.86666666666673" y="572.2">Time and points show activity. A written</tspan><tspan x="485.86666666666673" y="595.2">review explains why the activity mattered</tspan><tspan x="485.86666666666673" y="618.2">and what should happen next.</tspan></text><text font-family="Helvetica, 'Helvetica Neue', Arial, sans-serif" font-weight="300" font-size="13" fill="#9a9a9a" text-anchor="start"><tspan x="874.1333333333334" y="450.2">06</tspan></text><text font-family="Helvetica, 'Helvetica Neue', Arial, sans-serif" font-weight="300" font-size="21" fill="#f2f2f2" text-anchor="start"><tspan x="874.1333333333334" y="534.2">Keep AI contextual</tspan></text><text font-family="Helvetica, 'Helvetica Neue', Arial, sans-serif" font-weight="300" font-size="15" fill="#9a9a9a" text-anchor="start"><tspan x="874.1333333333334" y="572.2">Agent suggestions become useful when they</tspan><tspan x="874.1333333333334" y="595.2">can reference the object, page, and project</tspan><tspan x="874.1333333333334" y="618.2">the user is already working with.</tspan></text></svg>